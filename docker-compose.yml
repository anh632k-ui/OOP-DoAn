services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-med06}
      POSTGRES_USER: ${POSTGRES_USER:-med06}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-med06_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - med06_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-med06}
      POSTGRES_USER: ${POSTGRES_USER:-med06}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-med06_dev_password}
    volumes:
      - ./database:/sql:ro
    entrypoint: ["/bin/sh", "/sql/run-migrations.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-med06}
      PGUSER: ${POSTGRES_USER:-med06}
      PGPASSWORD: ${POSTGRES_PASSWORD:-med06_dev_password}
    volumes:
      - ./database:/sql:ro
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/sql/seed/001_demo.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-med06}:${POSTGRES_PASSWORD:-med06_dev_password}@db:5432/${POSTGRES_DB:-med06}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_INTERNAL_URL: http://backend:3001
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  med06_postgres_data:
