name: MED-06 database CI

on:
  push:
    branches: [med06-code]
    paths:
      - 'database/**'
      - 'docker-compose.yml'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/med06-db-ci.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'docker-compose.yml'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/med06-db-ci.yml'

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: docker compose up -d db
      - name: Apply migration
        run: docker compose run --rm migrate
      - name: Verify migration repeatability
        run: docker compose run --rm migrate
      - name: Seed twice
        run: |
          docker compose --profile seed run --rm seed
          docker compose --profile seed run --rm seed
      - name: Test PostgreSQL constraints
        run: docker compose exec -T db psql -U med06 -d med06 -v ON_ERROR_STOP=1 < database/tests/001_constraints.sql
      - name: List tables
        run: docker compose exec -T db psql -U med06 -d med06 -c "\dt"
      - name: Set local-only JWT secret for integration tests
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build and start NestJS + Next.js + PostgreSQL + object storage
        run: docker compose --profile storage up --build -d
      - name: Smoke test API and public events
        run: |
          curl --fail --silent --show-error --retry 15 --retry-delay 3 --retry-connrefused http://127.0.0.1:3001/api/health > /tmp/health.json
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:3001/api/events > /tmp/events.json
          python3 - <<'PY'
          import json
          health=json.load(open('/tmp/health.json'))
          assert health['status']=='ok' and health['database']=='connected'
          events=json.load(open('/tmp/events.json'))
          assert len(events['items']) == 2, events
          assert sum(e['sessionCount'] for e in events['items']) == 3
          print('PASS: API health and two published events / three sessions')
          PY
      - name: Smoke test registration, JWT, login, and role protection
        run: |
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"stage3-test@example.invalid","name":"Stage3 Test","password":"DemoSecurePass123","roles":["ADMIN"]}' http://127.0.0.1:3001/api/auth/register > /tmp/med06-auth.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/med06-auth.json'))
          assert data['user']['roles']==['ATTENDEE']
          assert data['tokenType']=='Bearer' and len(data['accessToken'])>30
          open('/tmp/med06-jwt','w').write(data['accessToken'])
          print('PASS: new account is ATTENDEE only')
          PY
          curl --fail --silent --show-error -H "Authorization: Bearer $(cat /tmp/med06-jwt)" http://127.0.0.1:3001/api/auth/me > /tmp/med06-me.json
          python3 - <<'PY'
          import json
          user=json.load(open('/tmp/med06-me.json'))
          assert user['email']=='stage3-test@example.invalid'
          assert user['roles']==['ATTENDEE']
          print('PASS: authenticated user lookup')
          PY
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $(cat /tmp/med06-jwt)" http://127.0.0.1:3001/api/auth/organizer-check)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/auth/me)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"stage3-test@example.invalid","name":"Again","password":"DemoSecurePass123"}' http://127.0.0.1:3001/api/auth/register)" = 409
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"stage3-test@example.invalid","password":"DemoSecurePass123"}' http://127.0.0.1:3001/api/auth/login > /tmp/med06-login.json
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/med06-login.json'))
          assert result['user']['email']=='stage3-test@example.invalid'
          assert result['accessToken']
          print('PASS: login with valid credentials')
          PY
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"stage3-test@example.invalid","password":"WrongPassword123"}' http://127.0.0.1:3001/api/auth/login)" = 401
          echo 'PASS: authentication and RBAC smoke tests'
      - name: Smoke test Next.js
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors --retry-connrefused http://127.0.0.1:3000/ > /tmp/med06.html
          grep -q 'Trien lam Di san' /tmp/med06.html
          echo 'PASS: Next.js renders seeded event data'
      - name: Smoke test browser registration and account session
        run: |
          curl -4 --fail --silent --show-error --cookie-jar /tmp/med06-cookies -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' -d '{"email":"stage3-web@example.invalid","name":"Web User","password":"SecureDemo98765"}' http://localhost:3000/api/auth/register > /tmp/med06-web-auth.json
          python3 - <<'PY'
          import json
          user=json.load(open('/tmp/med06-web-auth.json'))['user']
          assert user['email']=='stage3-web@example.invalid' and user['roles']==['ATTENDEE']
          print('PASS: browser registration endpoint')
          PY
          curl -4 --fail --silent --show-error --cookie /tmp/med06-cookies http://localhost:3000/account > /tmp/med06-account.html
          grep -q 'stage3-web@example.invalid' /tmp/med06-account.html
          test "$(curl -4 --silent --output /dev/null --write-out '%{http_code}' --cookie /tmp/med06-cookies -H 'Origin: http://localhost:3000' --request POST http://localhost:3000/api/auth/logout)" = 303
          test "$(curl -4 --silent --output /dev/null --write-out '%{http_code}' -H 'Origin: https://invalid.example' -H 'Content-Type: application/json' -d '{"email":"other@example.invalid","name":"Invalid","password":"SecureDemo98765"}' http://localhost:3000/api/auth/register)" = 403
          echo 'PASS: account page, HttpOnly cookie login and logout'
      - name: Smoke test organizer ownership, publishing and policy
        run: |
          # A newly registered ATTENDEE cannot manage events.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $(cat /tmp/med06-jwt)" http://127.0.0.1:3001/api/manage/events)" = 403
          # Demo-only role grant performed inside this isolated CI database.
          docker compose exec -T db psql -U med06 -d med06 -v ON_ERROR_STOP=1 -c "INSERT INTO nguoi_dung_vai_tro(ma_nguoi_dung,ma_vai_tro) SELECT n.ma_nguoi_dung,v.ma_vai_tro FROM nguoi_dung n CROSS JOIN vai_tro v WHERE n.email='stage3-test@example.invalid' AND v.ten_vai_tro='ORGANIZER' ON CONFLICT DO NOTHING;"
          token="$(cat /tmp/med06-jwt)"
          curl --fail --silent --show-error -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"title":"CI Cultural Event","description":"Integration test"}' http://127.0.0.1:3001/api/manage/events > /tmp/manage-event.json
          python3 - <<'PY'
          import json
          event=json.load(open('/tmp/manage-event.json'))
          assert event['status']=='NHAP'
          assert event['title']=='CI Cultural Event'
          open('/tmp/med06-managed-id','w').write(event['id'])
          PY
          eid="$(cat /tmp/med06-managed-id)"
          # Publishing without a configured session is rejected.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $token" -X POST http://127.0.0.1:3001/api/manage/events/$eid/publish)" = 409
          curl --fail --silent --show-error -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"venueId":"30000000-0000-4000-8000-000000000001","capacity":20,"startsAt":"2031-06-01T10:00:00+07:00","endsAt":"2031-06-01T12:00:00+07:00","registrationOpensAt":"2031-05-01T10:00:00+07:00","registrationClosesAt":"2031-05-31T10:00:00+07:00"}' "http://127.0.0.1:3001/api/manage/events/$eid/sessions" > /tmp/med06-managed-session.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/med06-managed-session.json'))
          assert s['status']=='NHAP'
          open('/tmp/med06-managed-session-id','w').write(s['id'])
          PY
          sid="$(cat /tmp/med06-managed-session-id)"
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"method":"FCFS"}' "http://127.0.0.1:3001/api/manage/sessions/$sid/policy" > /tmp/med06-policy.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"method":"HYBRID"}' -X PUT "http://127.0.0.1:3001/api/manage/sessions/$sid/policy")" = 400
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"verified":true,"featureIds":["70000000-0000-4000-8000-000000000001"],"note":"CI synthetic verified feature"}' "http://127.0.0.1:3001/api/manage/events/$eid/accessibility" > /tmp/med06-accessibility.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"verified":false,"featureIds":[]}' "http://127.0.0.1:3001/api/manage/events/$eid/accessibility")" = 400
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jxkkAAAAASUVORK5CYII=' | base64 -d > /tmp/med06-cover.png
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors -X POST -H "Authorization: Bearer $token" -F 'image=@/tmp/med06-cover.png;type=image/png' "http://127.0.0.1:3001/api/manage/events/$eid/cover" > /tmp/med06-cover-upload.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/med06-cover-upload.json'))['hasCover']
          print('PASS: S3-compatible event cover upload')
          PY
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $token" "http://127.0.0.1:3001/api/manage/events/$eid/publish" > /tmp/med06-published.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/med06-published.json'))['status']=='DA_CONG_BO'
          PY
          curl --fail --silent --show-error "http://127.0.0.1:3001/api/events/$eid/sessions" > /tmp/med06-published-sessions.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/med06-published-sessions.json'))
          assert len(data['items'])==1 and data['items'][0]['allocationMethod']=='FCFS'
          print('PASS: RBAC, event draft, capacity, policy and publishing')
          PY
          # Organizer page must render only for an authorized role.
          curl -4 --fail --silent --show-error --cookie-jar /tmp/med06-org-cookies -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' -d '{"email":"stage3-test@example.invalid","password":"DemoSecurePass123"}' http://localhost:3000/api/auth/login > /tmp/med06-org-login.json
          curl -4 --fail --silent --show-error --cookie /tmp/med06-org-cookies http://localhost:3000/organizer > /tmp/med06-organizer.html
          grep -q 'CI Cultural Event' /tmp/med06-organizer.html
          echo 'PASS: authorized organizer dashboard renders in Next.js'
          curl --fail --silent --show-error "http://127.0.0.1:3001/api/events/$eid" > /tmp/med06-public-event.json
          python3 - <<'PY'
          import json
          event=json.load(open('/tmp/med06-public-event.json'))
          assert len(event['accessibility'])==1
          assert event['accessibility'][0]['note']=='CI synthetic verified feature'
          print('PASS: accessibility available to public event visitors')
          PY
          curl --fail --silent --show-error "http://127.0.0.1:3001/api/events/$eid/cover" > /tmp/med06-cover-public.png
          cmp /tmp/med06-cover.png /tmp/med06-cover-public.png
          echo 'PASS: published event cover served from object storage'
      - name: End-to-end FCFS, Lottery, waitlist, ticket and check-in
        run: python3 database/tests/stage56_e2e.py
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --tail=100
